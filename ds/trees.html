<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="用单步动画理解常见树结构的性质与复杂度">
  <title>常见树结构 · 单步理解</title>
  <link rel="stylesheet" href="../shared/classic.css">
  <style>
  /* 这一页是早期版本，保留自己的两栏布局；配色与零件全部来自 shared/classic.css */
  .tree-main{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);
    min-height:0;overflow:hidden}
  .stage{padding:24px clamp(18px,3vw,44px);display:flex;flex-direction:column;gap:16px;
    overflow:auto;background:var(--paper)}
  .stage .diagram{height:300px;border:1px solid var(--rule);border-radius:var(--radius);
    background:var(--stage-bg);overflow:hidden;position:relative}
  .diagram svg{width:100%;height:100%;display:block}
  /* 这一页的树是早期实现，自己那套 SVG 类要在这里定色 */
  .edge{stroke:var(--edge);stroke-width:1;fill:none}
  .edge.hot{stroke:var(--accent);stroke-width:1.5}
  .node rect{fill:var(--node-fill);stroke:var(--node-line);stroke-width:1}
  .node .label{fill:var(--node-ink);font:600 14px var(--serif);text-anchor:middle;dominant-baseline:middle}
  .node.hot rect{fill:var(--accent);stroke:var(--accent)}
  .node.hot .label{fill:var(--paper)}
  .node.red rect{fill:#f3e2e2;stroke:var(--accent)}
  .node.black rect{fill:#2b2a26;stroke:#2b2a26}
  .node.black .label{fill:var(--paper)}
  .node.leaf rect{fill:#e8efe9;stroke:var(--ok)}
  .node.multi rect{rx:3}
  .node.doomed rect{fill:var(--paper-3);stroke:var(--muted);stroke-dasharray:3 2}
  .node.doomed .label{fill:var(--muted);text-decoration:line-through}
  .leafline{stroke:var(--ok);stroke-width:1;stroke-dasharray:3 3;fill:none}
  .leafline.hot{stroke:var(--accent);stroke-width:1.5}
  .drop{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3;fill:none}
  .drop.hot{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:none}
  .node.chain rect{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
  .node.chain .label{font-size:11px;fill:var(--muted)}
  .node.chain.hot rect{fill:var(--accent);stroke:var(--accent)}
  .node.chain.hot .label{fill:var(--paper)}
  aside{padding:22px;overflow:auto;background:var(--paper-2);border-left:1px solid var(--rule)}
  .legend{position:absolute;right:12px;bottom:9px;color:var(--faint);font-size:11px;font-family:var(--serif);font-style:italic}
  .footnote{font-size:12px;color:var(--muted);line-height:1.6;margin:8px 0 18px}
  .why{border-top:1px solid var(--rule);padding-top:10px}
  .why-line{display:flex;gap:12px;padding:5px 0;color:var(--ink-2);font:12.5px var(--mono)}
  .why-line i{font-style:normal;color:var(--faint);min-width:16px;text-align:right}
  .op-row{display:flex;align-items:baseline;gap:26px;flex-wrap:wrap;
    border-top:1px solid var(--rule-soft);padding:12px 0 11px}
  .op-tabs{display:flex;gap:26px;flex-wrap:wrap}
  .op-target{color:var(--muted);font-style:italic}
  .op-target b{color:var(--ink);font-style:normal}
  .step-meta{display:flex;gap:10px;flex-wrap:wrap}
  .metric{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;
    font:400 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .steps{display:flex;gap:16px;flex-wrap:wrap;padding-top:8px}
  .step{font:400 12px var(--sans);color:var(--faint);background:none;border:0;
    border-bottom:1px solid transparent;padding:2px 0;cursor:pointer}
  .step.done{color:var(--muted)}
  .step.on{color:var(--accent);border-bottom-color:var(--accent)}
  .scene-title{font-size:clamp(22px,3vw,32px);font-weight:400;line-height:1.25;margin:0}
  .scene-copy{font-size:15.5px;line-height:1.75;color:var(--ink-2);margin:0;max-width:62ch}
  .scene-copy b{color:var(--accent)}
  .scene-copy strong{color:var(--gold)}
  .scene-copy code{background:var(--paper-3);padding:1px 5px;border-radius:3px}
  .eyebrow{font:400 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .summary h2{font-weight:400;font-size:20px;margin:6px 0 4px}
  .summary p{color:var(--muted);margin:0;font-size:13px}
  .use{margin-top:10px;padding:9px 11px;border:1px solid var(--rule);border-radius:2px;
    background:var(--paper);color:var(--ink-2);font-size:12.5px}
  .use b{color:var(--accent);font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:5px}
  .features h3{font:400 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:14px 0 7px}
  .features ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.7}
  @media(max-width:900px){.tree-main{grid-template-columns:1fr}aside{border-left:0;border-top:1px solid var(--rule)}}
</style>
</head>

    bplusBase:{nodes:[n('root',50,30,'30 | 50','multi'),n('l0',17,150,'10 | 20','leaf'),n('l1',50,150,'30 | 42','leaf'),n('l2',83,150,'50 | 60','leaf')],leafNodes:[n('c0',17,206,'10 | 20','chain'),n('c1',50,206,'30 | 42','chain'),n('c2',83,206,'50 | 60','chain')],leafEdges:[['c0','c1'],['c1','c2']],edges:[['root','l0'],['root','l1'],['root','l2']]},
    bplusOverflow:{nodes:[n('root',50,30,'30 | 50','multi'),n('l0',17,150,'10 | 20','leaf'),n('l1',50,150,'30 | 42 | 45','leaf'),n('l2',83,150,'50 | 60','leaf')],leafNodes:[n('c0',17,206,'10 | 20','chain'),n('c1',50,206,'30 | 42 | 45','chain'),n('c2',83,206,'50 | 60','chain')],leafEdges:[['c0','c1'],['c1','c2']],edges:[['root','l0'],['root','l1'],['root','l2']]},
    bplusSplit:{nodes:[n('root',50,30,'30 | 50','multi'),n('l0',12,150,'10 | 20','leaf'),n('l1',38,150,'30 | 42','leaf'),n('l2',64,150,'45','leaf'),n('l3',88,150,'50 | 60','leaf')],leafNodes:[n('c0',12,206,'10 | 20','chain'),n('c1',38,206,'30 | 42','chain'),n('c2',64,206,'45','chain'),n('c3',88,206,'50 | 60','chain')],leafEdges:[['c0','c1'],['c1','c2'],['c2','c3']],edges:[['root','l0'],['root','l1'],['root','l2'],['root','l3']]},

  const DIAGRAM_TEXT={根:['根','root'],文档:['文档','docs'],项目:['项目','projects'],媒体:['媒体','media'],'报告.pdf':['报告.pdf','report.pdf'],新文件:['新文件','new file'],测试:['测试','tests'],素材:['素材','assets'],叶子顺序链:['叶子顺序链','linked leaves']};
  const diagramText=x=>DIAGRAM_TEXT[x]?DIAGRAM_TEXT[x][I18N.lang==='en'?1:0]:x;
  /* 布局与绘制都来自 shared/trees-render.js —— 页面和 tools/trees-page.mjs 共用同一份。
   * 这里只保留"取数据 + 二选一标签"这层薄包装，避免两处实现各写各的。 */
  const cloneDiagram=TreesRender.cloneDiagram, layoutWithD3=TreesRender.layoutDiagram;
  /* 图就是数据：B+ 的叶子链格子单独写在 leafNodes 里，取图只做一次深拷贝。
   * 不再为"统一四层"给树挂假节点 —— 那会凭空造出 1.94、child/leaf 这类节点。 */
  function diagramFor(name){ return cloneDiagram(diagrams[name]) }
  const draw=(name,focus)=>TreesRender.drawDiagram(diagramFor(name),focus,diagramText);
  function activeFlow(s){return s.walkthroughs[currentOp]||s.walkthroughs.overview}
  function renderTabs(){const box=$('tabs');box.innerHTML='';DATA.structures.forEach((s,i)=>{let b=document.createElement('button');b.className='tab '+(i===current?'on':'');b.textContent=t(s.name);b.onclick=()=>{current=i;currentOp='overview';render(true)};box.append(b)})}
  function renderOperations(s){const box=$('operations');box.innerHTML='';Object.entries(s.walkthroughs).forEach(([key,flow])=>{const b=document.createElement('button');b.className='op-tab '+(key===currentOp?'on':'');b.textContent=t(flow.name);b.onclick=()=>{currentOp=key;render(false,true)};box.append(b)});const flow=activeFlow(s),target=$('operationTarget');target.hidden=!flow.target;target.innerHTML=flow.target?UI[I18N.lang].target+'<b>'+t(flow.target)+'</b>':''}
  function renderSide(s){$('sideLabel').textContent=UI[I18N.lang].side;$('sideTitle').textContent=t(s.name);$('sideTagline').textContent=t(s.tagline);$('featuresLabel').textContent=UI[I18N.lang].features;$('featureList').innerHTML=s.features.map(x=>'<li>'+t(x)+'</li>').join('');$('useLabel').textContent=UI[I18N.lang].use;$('useText').textContent=t(s.use);$('opHead').textContent=UI[I18N.lang].op;$('commonHead').textContent=UI[I18N.lang].common;$('worstHead').textContent=UI[I18N.lang].worst;$('ops').innerHTML=s.ops.map(r=>'<tr><td>'+r[I18N.lang==='zh'?0:1]+'</td><td>'+t(r[2])+'</td><td>'+t(r[3])+'</td></tr>').join('');$('footnote').textContent=t(s.footnote);$('whyHead').textContent=UI[I18N.lang].why;$('whyLines').innerHTML=s.code.map((l,i)=>'<div class="why-line" data-line="'+i+'"><i>'+String(i+1).padStart(2,'0')+'</i><span>'+t(l)+'</span></div>').join('')}
  function renderSteps(flow){const box=$('steps');box.innerHTML='';flow.scenes.forEach((x,i)=>{const b=document.createElement('button');b.className='step';b.textContent=(i+1)+'. '+t(x.tag);b.onclick=()=>{stepper.pause();stepper.go(i)};box.append(b)})}
  function labelsUpdate(){Object.assign(labels,UI[I18N.lang]);ctl.labels();$('lang').textContent=I18N.lang==='zh'?'EN':'中文';document.documentElement.lang=I18N.lang==='zh'?'zh-CN':'en';document.title=UI[I18N.lang].title}
  function applyStep(i){const s=DATA.structures[current],flow=activeFlow(s),x=flow.scenes[i];if(!x)return;$('eyebrow').textContent=t(s.name)+' · '+t(flow.name)+' · '+t(x.tag);$('sceneTitle').textContent=t(x.title);$('sceneCopy').innerHTML=t(x.text);$('cost').textContent=t(x.cost)||'';$('diagram').innerHTML=draw(x.diagram,x.focus);$('diagram').insertAdjacentHTML('beforeend','<span class="legend">'+UI[I18N.lang].legend+'</span>');document.querySelectorAll('.step').forEach((b,k)=>b.className='step '+(k<i?'done':'')+(k===i?' on':''))}
  function render(resetTree,resetFlow){const s=DATA.structures[current],flow=activeFlow(s);labelsUpdate();$('title').textContent=t(s.name);$('tagline').textContent=t(s.tagline);renderTabs();renderOperations(s);renderSide(s);renderSteps(flow);stepper.pause();stepper.length=flow.scenes.length;stepper.go(resetTree||resetFlow?0:Math.min(stepper.index,flow.scenes.length-1))}
  $('lang').onclick=()=>{I18N.toggle();render(false,false)};render(true,false);
  </script>
